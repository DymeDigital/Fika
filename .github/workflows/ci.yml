name: Build check

# Verifies the site still builds — including pulling and validating every product
# row from the Google Sheet (scripts/fetch-products.mjs, run by the prebuild hook).
# Catches a bad sheet edit or a TypeScript error before it reaches the host.
#
# Deployment is a manual upload of out/ to Afrihost (Apache), not here. This workflow never
# deploys anything.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SHEET_ID               spreadsheet id from its URL
#   GOOGLE_SHEETS_API_KEY  Google Cloud API key restricted to the Google Sheets API

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps-script/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps-script/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Google Sheet secrets (never silently use the stale snapshot)
        run: |
          if [ -z "${{ secrets.SHEET_ID }}" ] || [ -z "${{ secrets.GOOGLE_SHEETS_API_KEY }}" ]; then
            echo "::error::SHEET_ID and GOOGLE_SHEETS_API_KEY must both be set as repository secrets."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build static export (prebuild pulls products from the Google Sheet)
        run: npm run build
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}

      - name: Keep out/ as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out
          retention-days: 5
